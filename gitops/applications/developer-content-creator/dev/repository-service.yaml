apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-content-creator-repository-service-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: developer-content-creator
    app.kubernetes.io/component: microservice
spec:
  project: developer-content-creator
  sources:
    - repoURL: https://github.com/dso2530/developer-content-creator.git
      targetRevision: develop
      path: deployment/helm/developer-content-creator
      helm:
        valueFiles:
          - $values/gitops/dev/repository-service/values.yaml
    - repoURL: https://github.com/dso2530/developer-content-creator.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: developer-content-creator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
