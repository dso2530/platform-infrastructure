apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: document-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-public-benefits-platform
    app.kubernetes.io/component: microservice

spec:
  project: public-benefits

  sources:
    # Source principale : chart Helm générique
    - repoURL: https://github.com/dso2530/platform-infrastructure.git
      targetRevision: main
      path: helm/charts/spring-boot-microservice
      helm:
        releaseName: document-service
        valueFiles:
          - $values/helm/environments/dev/common.yaml
          - $values/helm/environments/dev/ai-public-benefits/document-service.yaml

    # Source secondaire : fichiers de valeurs Helm
    - repoURL: https://github.com/dso2530/platform-infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: public-benefits

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

  revisionHistoryLimit: 5
