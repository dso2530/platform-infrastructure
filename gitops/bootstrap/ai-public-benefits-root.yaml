apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-public-benefits-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-public-benefits-platform
    app.kubernetes.io/component: root-application
spec:
  project: platform-infrastructure
  source:
    repoURL: https://github.com/dso2530/platform-infrastructure.git
    targetRevision: main
    path: gitops/applications/ai-public-benefits/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
