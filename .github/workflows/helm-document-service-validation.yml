name: Helm - Document Service Validation

on:
  pull_request:
    paths:
      - "helm/charts/spring-boot-microservice/**"
      - "helm/environments/dev/document-service.yaml"
      - ".kubeconform/**"
      - "scripts/helm/validate-document-service-chart.sh"
      - ".github/workflows/helm-document-service-validation.yml"

  push:
    paths:
      - "helm/charts/spring-boot-microservice/**"
      - "helm/environments/dev/document-service.yaml"
      - ".kubeconform/**"
      - "scripts/helm/validate-document-service-chart.sh"
      - ".github/workflows/helm-document-service-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-document-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
            fetch-depth: 0


      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install Kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Display tool versions
        run: |
          helm version --short
          kubeconform -v
          go version

      - name: Validate Document Service Helm chart
        run: |
          bash scripts/helm/validate-document-service-chart.sh

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"