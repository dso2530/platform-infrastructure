name: GitOps Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitops/**"
      - "scripts/gitops/**"
      - "tests/**"
      - "schemas/**"
      - ".github/workflows/gitops-validation.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

  push:
    branches:
      - main
    paths:
      - "gitops/**"
      - "scripts/gitops/**"
      - "tests/**"
      - "schemas/**"
      - ".github/workflows/gitops-validation.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate GitOps manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        id: install_dependencies
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Kubeconform
        id: install_kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/bin"

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/kubeconform.tar.gz"

          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" \
            -C "$RUNNER_TEMP" kubeconform

          install "$RUNNER_TEMP/kubeconform" \
            "$RUNNER_TEMP/bin/kubeconform"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/bin/kubeconform" -v

      - name: Detect prepared changes
        id: detect_prepared
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/gitops/detect_prepared_changes.py

      - name: Validate YAML syntax
        id: validate_yaml
        run: python scripts/gitops/validate_yaml.py

      - name: Validate AppProjects
        id: validate_projects
        run: python scripts/gitops/validate_projects.py

      - name: Validate Applications
        id: validate_applications
        run: python scripts/gitops/validate_applications.py

      - name: Validate root Applications
        id: validate_roots
        run: python scripts/gitops/validate_roots.py

      - name: Validate Application and AppProject references
        id: validate_references
        run: python scripts/gitops/validate_project_references.py

      - name: Validate ArgoCD schemas
        id: validate_schemas
        run: scripts/gitops/validate_schemas.sh

      - name: Run GitOps unit tests
        id: pytest
        run: python -m pytest -v tests/gitops/

      - name: Generate GitOps validation report
        if: always()
        env:
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          PYTHON_STATUS: ${{ steps.setup_python.outcome }}
          DEPENDENCIES_STATUS: ${{ steps.install_dependencies.outcome }}
          KUBECONFORM_INSTALL_STATUS: ${{ steps.install_kubeconform.outcome }}
          PREPARED_STATUS: ${{ steps.detect_prepared.outcome }}
          YAML_STATUS: ${{ steps.validate_yaml.outcome }}
          PROJECTS_STATUS: ${{ steps.validate_projects.outcome }}
          APPLICATIONS_STATUS: ${{ steps.validate_applications.outcome }}
          ROOTS_STATUS: ${{ steps.validate_roots.outcome }}
          REFERENCES_STATUS: ${{ steps.validate_references.outcome }}
          SCHEMAS_STATUS: ${{ steps.validate_schemas.outcome }}
          PYTEST_STATUS: ${{ steps.pytest.outcome }}
        run: |
          set -Eeuo pipefail

          {
            echo "# GitOps Validation Report"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo
            echo "**Event:** \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "## Résultats des validations"
            echo
            echo "| Contrôle | Résultat |"
            echo "|---|---|"

            print_status() {
              case "$2" in
                success)
                  echo "| $1 | ✅ Réussi |"
                  ;;
                failure)
                  echo "| $1 | ❌ Échec |"
                  ;;
                cancelled)
                  echo "| $1 | ⚪ Annulé |"
                  ;;
                skipped)
                  echo "| $1 | ⏭️ Ignoré |"
                  ;;
                *)
                  echo "| $1 | ⚠️ $2 |"
                  ;;
              esac
            }

            print_status "Checkout" "$CHECKOUT_STATUS"
            print_status "Configuration Python" "$PYTHON_STATUS"
            print_status "Installation des dépendances" "$DEPENDENCIES_STATUS"
            print_status "Installation Kubeconform" "$KUBECONFORM_INSTALL_STATUS"
            print_status "Détection prepared/" "$PREPARED_STATUS"
            print_status "Syntaxe YAML" "$YAML_STATUS"
            print_status "AppProjects" "$PROJECTS_STATUS"
            print_status "Applications enfants" "$APPLICATIONS_STATUS"
            print_status "Applications racines" "$ROOTS_STATUS"
            print_status "Références Application / AppProject" "$REFERENCES_STATUS"
            print_status "Schémas ArgoCD" "$SCHEMAS_STATUS"
            print_status "Tests unitaires Python" "$PYTEST_STATUS"

            echo
            echo "## Environnement"
            echo
            echo "- Runner : ubuntu-24.04"
            echo "- Python : 3.12"
            echo "- Kubeconform : 0.8.0"
            echo "- Pytest : 8.4.2"
            echo
            echo "## Sécurité GitOps"
            echo
            echo "- Permissions GitHub : contents: read"
            echo "- Aucun accès au cluster Kubernetes."
            echo "- Aucune synchronisation ArgoCD automatique déclenchée."
            echo "- Les manifests prepared/ restent inactifs."
            echo "- Aucun déploiement automatique."
            echo
            echo "Consulter les logs des étapes en échec pour obtenir les détails."
          } >> "$GITHUB_STEP_SUMMARY"
