name: Helm Validation

on:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".kubeconform/**"
      - "tests/helm/**"
      - "scripts/helm/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/helm-validation.yml"
      - ".github/workflows/helm-document-service-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "helm/**"
      - ".kubeconform/**"
      - "tests/helm/**"
      - "scripts/helm/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/helm-validation.yml"
      - ".github/workflows/helm-document-service-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - name: Install Kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          sudo tar -xzf /tmp/kubeconform.tar.gz \
            -C /usr/local/bin kubeconform

          kubeconform -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Display tool versions
        run: |
          python --version
          helm version --short
          kubeconform -v
          python -m pytest --version

      - name: Validate Helm microservices
        run: |
          bash scripts/helm/validate-microservices-chart.sh

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Run Helm tests
        run: |
          python -m pytest -v tests/helm/ \
            --junitxml=helm-test-results.xml

      - name: Run complete test suite
        run: |
          python -m pytest -v \
            --junitxml=test-results.xml

      - name: Validate Python compilation
        run: |
          python -m compileall -q scripts tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-validation-reports
          path: |
            helm-test-results.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 14